<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00ff88"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0a0a14"/>
  
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#meshGrad)" stroke-width="2" opacity="0.3"/>
  
  <!-- Mesh nodes -->
  <g filter="url(#glow)">
    <!-- Center node -->
    <circle cx="32" cy="32" r="5" fill="url(#meshGrad)"/>
    
    <!-- Outer nodes -->
    <circle cx="32" cy="14" r="4" fill="#00d4ff"/>
    <circle cx="48" cy="24" r="4" fill="#00d4ff"/>
    <circle cx="48" cy="42" r="4" fill="#00d4ff"/>
    <circle cx="32" cy="50" r="4" fill="#00ff88"/>
    <circle cx="16" cy="42" r="4" fill="#00d4ff"/>
    <circle cx="16" cy="24" r="4" fill="#00d4ff"/>
  </g>
  
  <!-- Mesh connections -->
  <g stroke="url(#meshGrad)" stroke-width="1.5" opacity="0.6">
    <!-- Center to outer -->
    <line x1="32" y1="32" x2="32" y2="14"/>
    <line x1="32" y1="32" x2="48" y2="24"/>
    <line x1="32" y1="32" x2="48" y2="42"/>
    <line x1="32" y1="32" x2="32" y2="50"/>
    <line x1="32" y1="32" x2="16" y2="42"/>
    <line x1="32" y1="32" x2="16" y2="24"/>
    
    <!-- Outer ring connections -->
    <line x1="32" y1="14" x2="48" y2="24"/>
    <line x1="48" y1="24" x2="48" y2="42"/>
    <line x1="48" y1="42" x2="32" y2="50"/>
    <line x1="32" y1="50" x2="16" y2="42"/>
    <line x1="16" y1="42" x2="16" y2="24"/>
    <line x1="16" y1="24" x2="32" y2="14"/>
  </g>
</svg>
